<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caderno Clipper</title><link rel="stylesheet" href="popup.css"><main><header><strong>Caderno</strong><span>Web Clipper</span></header><section id="pair"><label for="code">Código do app</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><label for="nonce">Código de conexão</label><input id="nonce" autocomplete="off" placeholder="Cole o código mostrado pelo app"><button id="pairButton">Conectar extensão</button></section><section id="capture" hidden><p id="origin"></p><label for="notebook">Salvar no caderno</label><select id="notebook"></select><fieldset><legend>O que salvar</legend><label><input type="radio" name="mode" value="article" checked> Artigo</label><label><input type="radio" name="mode" value="selection"> Seleção</label><label><input type="radio" name="mode" value="page"> Página</label></fieldset><p class="hint">Somente texto e HTML. Imagens externas não são baixadas.</p><button id="save">Salvar página</button><button id="disconnect" class="quiet">Desconectar</button></section><p id="message" role="status"></p></main><script src="popup.js"></script></html>
